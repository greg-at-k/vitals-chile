name: Refresh dashboard data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 5'
permissions:
  contents: write
concurrency:
  group: bcch-source-access
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - name: Retrieve and validate all sources
        env:
          BCCH_API_TOKEN: ${{ secrets.BCCH_API_TOKEN }}
          REFRESH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python refresh.py
      - run: python -m unittest discover -s tests
      - name: Publish atomic dataset
        run: |
          git config user.name 'greg-at-k'
          git config user.email 'gregorio.alvarado@kellogg.northwestern.edu'
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "Refresh Chile source data"
          git pull --rebase origin main
          git push origin HEAD:main
